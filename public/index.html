<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OMNIA AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238b7bff'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0c0d14;--p:#14161f;--b:#242736;--t:#eceaff;--m:#8a8ca8;--a:#8b7bff;--a2:#ffb86b;--r:14px}
[data-theme=light]{--bg:#f5f4fa;--p:#fff;--b:#e2e1ee;--t:#17172b;--m:#6c6c88;--a:#6a45ff;--a2:#e8870e}
[data-theme=aurora]{--bg:#061519;--p:#0c2229;--b:#17434d;--t:#e4fff9;--m:#78b3ad;--a:#19e6b0;--a2:#4f9bff}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 Sora,system-ui,sans-serif;background:var(--bg);color:var(--t);height:100dvh;overflow:hidden}
button,textarea,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.btn{background:var(--a);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn.o{background:none;border:1px solid var(--b);color:var(--t)}
#login{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#login h1{font-size:44px;letter-spacing:-1px;animation:pop .7s both}#login p{color:var(--m);max-width:340px}
#login svg{width:84px;animation:spin 14s linear infinite}
@keyframes pop{from{opacity:0;transform:scale(.85)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(8px)}}
#app{display:grid;grid-template-columns:260px 1fr;height:100dvh}
aside{background:var(--p);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:16px 12px;gap:8px;min-height:0}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:20px;padding:4px 8px 12px}.logo svg{width:30px}
.nv{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r);color:var(--m);text-align:left;width:100%;transition:.2s}
.nv:hover{background:var(--bg);color:var(--t)}.nv.on{background:var(--a);color:#fff;transform:translateX(4px)}
.hh{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:13px;margin-top:10px;padding:0 6px}
.hh button{color:var(--a2)}#hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.hi{padding:8px 10px;border-radius:10px;color:var(--m);font-size:13px;display:flex;gap:6px;cursor:pointer;animation:up .3s both}.hi:hover{background:var(--bg);color:var(--t)}
.hi span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hi b{font-weight:400}.hi b.s{color:var(--a2)}
#adm{color:var(--m);font-size:13px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--b)}#adm:hover{color:var(--a2)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--b)}
header .sp{flex:1}#ann{color:var(--a2);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dc{background:#5865f2;color:#fff;padding:8px 16px;border-radius:99px;font-weight:600;font-size:14px;text-decoration:none}
select{background:var(--bg);border:1px solid var(--b);border-radius:99px;padding:7px 12px}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--b)}#mb{display:none}
#ad{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;text-align:center;padding:8px;font-size:14px;font-weight:600}
#msgs{flex:1;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.m{max-width:min(760px,92%);padding:12px 16px;border-radius:var(--r);animation:up .3s both;word-wrap:break-word}
.m.user{align-self:flex-end;background:var(--a);color:#fff}.m.ai{background:var(--p);border:1px solid var(--b)}.m.err{border-color:#ff5d6c;color:#ff8791}
.m img,.m video{max-width:100%;border-radius:10px;display:block;margin-top:6px}
pre{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:12px;overflow:auto;margin:8px 0;position:relative;font-size:13px}
.cp{position:absolute;right:8px;top:8px;font-size:12px;color:var(--a2)}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--a);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-6px)}}
.hero{margin:auto;text-align:center;max-width:560px;animation:pop .5s both}.hero h2{font-size:28px;letter-spacing:-.5px}.hero p{color:var(--m);margin:6px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chips button{border:1px solid var(--b);border-radius:99px;padding:8px 14px;font-size:13px;transition:.2s}.chips button:hover{border-color:var(--a);color:var(--a)}
.in{display:flex;gap:10px;padding:12px 18px 16px;align-items:flex-end}
.in textarea{flex:1;resize:none;max-height:140px;background:var(--p);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;outline:0}.in textarea:focus{border-color:var(--a)}
#bn{display:none}
#av{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:20px;animation:pop .25s both}
#av .w{max-width:900px;margin:auto;display:grid;gap:16px}.card{background:var(--p);border:1px solid var(--b);border-radius:var(--r);padding:16px}
.card h3{margin-bottom:8px}.card input,.card textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:9px;margin-bottom:8px}
.row{font-size:13px;padding:6px 0;border-bottom:1px solid var(--b)}.row small{color:var(--m)}
[hidden]{display:none!important}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:10;transform:translateX(-100%);transition:.25s}body.o aside{transform:none}
#mb{display:block}#bn{display:flex;border-top:1px solid var(--b);background:var(--p);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}#bn .nv{flex-direction:column;gap:2px;font-size:11px;justify-content:center;align-items:center;padding:6px}#bn .nv.on{transform:none}
#ann{display:none}.hh+#hist{min-height:120px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="lg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--a)" stroke-width="5"/><ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="var(--a2)" stroke-width="4" transform="rotate(35 32 32)"/><circle cx="32" cy="32" r="7" fill="var(--a)"/></symbol></defs></svg>

<div id="login" hidden>
 <svg><use href="#lg"/></svg><h1>OMNIA AI</h1>
 <p>Chat, code, images and videos in one place. Free to use.</p>
 <div id="gbtn"></div><button class="btn" id="guest">Continue as guest</button><small id="lerr" style="color:#ff8791"></small>
</div>

<div id="app" hidden>
 <aside>
  <div class="logo"><svg><use href="#lg"/></svg>OMNIA</div>
  <nav id="nav"></nav>
  <div class="hh"><span>Recent</span><button id="sv">☆ Saved</button></div>
  <div id="hist"></div>
  <div id="adm">Admin</div>
 </aside>
 <main>
  <header>
   <button class="ic" id="mb" aria-label="Menu">☰</button>
   <a id="dc" target="_blank" rel="noopener">Discord</a><span id="ann"></span><span class="sp"></span>
   <span id="st" title="Daily streak"></span>
   <select id="th"><option value="dark">Black</option><option value="light">White</option><option value="aurora">Aurora</option></select>
   <button class="ic" id="sn" aria-label="Sound">🔊</button><button class="ic" id="lo" aria-label="Sign out">⏻</button>
  </header>
  <div id="ad" hidden></div>
  <div id="msgs"></div>
  <div class="in"><textarea id="q" rows="1"></textarea><button class="btn" id="go">Send</button></div>
  <nav id="bn"></nav>
 </main>
</div>

<div id="av" hidden><div class="w">
 <div style="display:flex;justify-content:space-between;align-items:center"><h2>Admin panel</h2><button class="btn o" id="ax">Close</button></div>
 <div class="card"><h3 id="as"></h3><div id="al"></div></div>
 <div class="card"><h3>Announcement and ad</h3><input id="an" placeholder="Announcement shown at the top"><textarea id="ad2" rows="2" placeholder="Ad banner text (leave empty to hide)"></textarea><button class="btn" id="ab">Publish</button></div>
 <div class="card"><h3>All user chats (latest 200)</h3><div id="ac"></div></div>
</div></div>

<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MODES={chat:['💬','Chat','Ask anything…',['Explain black holes simply','Plan a 3-day trip to Goa','Write a polite leave email']],
code:['⌨️','Code','Describe the code you need…',['Python script to rename files','React todo app','Explain async/await']],
image:['🖼️','Image','Describe an image…',['A neon city in the rain','Cute robot reading a book','Minimal mountain poster']],
video:['🎬','Video','Type what the avatar should say…',['Welcome to my channel!','Introduce my small business','Explain a healthy morning routine']]};
let tok=localStorage.tok,mode='chat',msgs={chat:[],code:[],image:[],video:[]},busy=0,at,cfg={},snd=localStorage.snd!=='0',ac;
const api=async(p,body,h={})=>{const r=await fetch('/api/'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok,...h},body:body&&JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&h['x-admin']===undefined)out();throw new Error(j.error||'Error '+r.status)}return j};
const beep=(f=620,d=.09)=>{if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=t=>t.split('```').map((p,i)=>i%2?`<pre><button class="cp">Copy</button><code>${esc(p.replace(/^\w*\n/,''))}</code></pre>`:esc(p).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('');

function theme(t){document.documentElement.dataset.theme=t;localStorage.th=t;$('#th').value=t}
theme(localStorage.th||'dark');
$('#th').onchange=e=>{theme(e.target.value);beep(500)};
$('#sn').onclick=()=>{snd=!snd;localStorage.snd=snd?1:0;$('#sn').textContent=snd?'🔊':'🔇';beep(800)};$('#sn').textContent=snd?'🔊':'🔇';

function nav(){for(const el of [$('#nav'),$('#bn')]){el.innerHTML=Object.entries(MODES).map(([k,v])=>`<button class="nv ${k===mode?'on':''}" data-m="${k}"><span>${v[0]}</span>${v[1]}</button>`).join('');el.onclick=e=>{const b=e.target.closest('.nv');if(b)setMode(b.dataset.m)}}}
function setMode(m){mode=m;beep(520);document.body.classList.remove('o');nav();$('#q').placeholder=MODES[m][2];draw();$('#q').focus()}
function draw(){const L=msgs[mode],M=$('#msgs');
 if(!L.length){M.innerHTML=`<div class="hero"><h2>${MODES[mode][0]} ${MODES[mode][1]}</h2><p>${mode==='video'?'Avatar videos take a few minutes to render.':'Pick an idea or write your own.'}</p><div class="chips">${MODES[mode][3].map(s=>`<button>${s}</button>`).join('')}</div></div>`;return}
 M.innerHTML=L.map(x=>`<div class="m ${x.r}${x.err?' err':''}">${x.load?'<span class="dots"><i></i><i></i><i></i></span> '+(x.t||''):fmt(x.t||'')}${x.img?`<img src="${x.img}"><a class="btn o" style="display:inline-block;margin-top:8px;font-size:13px;padding:6px 14px;text-decoration:none" download="omnia.png" href="${x.img}">Download</a>`:''}${x.vid?`<video controls src="${x.vid}"></video>`:''}</div>`).join('');M.scrollTop=M.scrollHeight}
$('#msgs').onclick=e=>{const c=e.target.closest('.cp');if(c){navigator.clipboard.writeText(c.nextElementSibling.textContent);c.textContent='Copied';beep(900)}const h=e.target.closest('.chips button');if(h){$('#q').value=h.textContent;send()}};

async function send(){const q=$('#q').value.trim();if(!q||busy)return;busy=1;$('#q').value='';beep(700);const m=mode,L=msgs[m];
 L.push({r:'user',t:q});const w={r:'ai',t:'',load:1};L.push(w);draw();
 try{
  if(m==='video'){const {id}=await api('video',{prompt:q});w.t='Rendering your video…';if(mode===m)draw();
   for(let i=0;i<120;i++){await sleep(5000);const s=await api('video/'+id);if(s.status==='completed'){w.vid=s.url;break}if(s.status==='failed')throw new Error(s.error||'Video failed');if(i===119)throw new Error('Video is taking too long. Try again later.')}}
  else{const hist=L.slice(0,-1).filter(x=>x.t&&!x.err).slice(-12).map(x=>({role:x.r==='user'?'user':'assistant',content:x.t}));
   const r=await api('gen',{mode:m,messages:m==='image'?[{role:'user',content:q}]:hist});w.t=r.text;w.img=r.img}
  w.load=0;beep(880,.12)}catch(e){w.load=0;w.err=1;w.t=e.message;beep(220,.2)}
 busy=0;if(mode===m)draw();hist()}
$('#go').onclick=send;$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>760){e.preventDefault();send()}};
$('#q').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};

let savedOnly=0;
async function hist(){try{const l=await api('history'+(savedOnly?'?saved=1':''));$('#hist').innerHTML=l.length?l.map(c=>`<div class="hi" data-id="${c.id}"><span>${MODES[c.mode][0]} ${esc(c.q)}</span><b class="${c.saved?'s':''}" data-s="${c.id}">${c.saved?'★':'☆'}</b></div>`).join(''):'<div class="hi">Nothing here yet</div>';$('#hist').dataset.l=JSON.stringify(l)}catch{}}
$('#hist').onclick=async e=>{const l=JSON.parse($('#hist').dataset.l||'[]'),s=e.target.closest('[data-s]');
 if(s){await api('save',{id:s.dataset.s});beep(800);return hist()}
 const h=e.target.closest('.hi[data-id]');if(!h)return;const c=l.find(x=>x.id===h.dataset.id);
 msgs[c.mode]=[{r:'user',t:c.q},{r:'ai',t:c.mode==='chat'||c.mode==='code'?c.a:'(Open this section and generate again to see the result)'}];setMode(c.mode)};
$('#sv').onclick=()=>{savedOnly=!savedOnly;$('#sv').textContent=savedOnly?'★ Saved':'☆ Saved';beep(650);hist()};
$('#mb').onclick=()=>document.body.classList.toggle('o');

function streak(){const d=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString(),s=JSON.parse(localStorage.sk||'{"d":"","n":0}');
 if(s.d!==d){s.n=s.d===y?s.n+1:1;s.d=d;localStorage.sk=JSON.stringify(s)}$('#st').textContent='🔥 '+s.n}

async function enter(u){tok=u.token||tok;if(u.token)localStorage.tok=u.token;$('#login').hidden=1;$('#app').hidden=0;
 $('#dc').href=cfg.discord;if(cfg.ann){$('#ann').textContent='📢 '+cfg.ann}if(cfg.ad){$('#ad').textContent=cfg.ad;$('#ad').hidden=0}
 nav();setMode('chat');streak();hist();setInterval(()=>api('ping',{mode}).catch(()=>{}),20000)}
function out(){localStorage.removeItem('tok');location.reload()}
$('#lo').onclick=out;
async function login(p,b){try{enter(await api(p,b||{}))}catch(e){$('#lerr').textContent=e.message}}
$('#guest').onclick=()=>{beep();login('guest')};

(async()=>{cfg=await fetch('/api/config').then(r=>r.json()).catch(()=>({}));
 if(tok){try{await api('me');return enter({})}catch{}}
 $('#login').hidden=0;
 if(cfg.gid){for(let i=0;i<50&&!window.google;i++)await sleep(100);
  if(window.google){google.accounts.id.initialize({client_id:cfg.gid,callback:r=>login('google',{credential:r.credential})});google.accounts.id.renderButton($('#gbtn'),{theme:'filled_black',size:'large',shape:'pill',text:'continue_with'})}}})();

/* ---- admin ---- */
$('#adm').onclick=async()=>{const p=prompt('Admin password');if(!p)return;
 try{at=(await api('admin/login',{password:p},{'x-admin':''})).token;$('#av').hidden=0;await panel();$('#av').timer=setInterval(()=>panel(1),10000)}catch(e){alert(e.message)}};
$('#ax').onclick=()=>{$('#av').hidden=1;clearInterval($('#av').timer)};
async function panel(soft){const H={'x-admin':at},s=await api('admin/stats',null,H);
 $('#as').textContent=`${s.active.length} active now · ${s.users} users · ${s.chats} chats`;
 $('#al').innerHTML=s.active.map(a=>`<div class="row">${esc(a.name||'?')} <small>${a.type} · ${esc(a.loc||'?')} · using ${a.mode}</small></div>`).join('')||'<small>No one online</small>';
 if(!soft){$('#an').value=s.ann;$('#ad2').value=s.ad}
 const c=await api('admin/chats',null,H);
 $('#ac').innerHTML=c.map(x=>`<div class="row"><b>${esc(x.name)}</b> <small>${x.mode} · ${esc(x.loc||'?')} · ${new Date(x.t).toLocaleString()}</small><br>Q: ${esc(x.q)}<br><small>A: ${esc((x.a||'').slice(0,400))}</small></div>`).join('')||'<small>No chats yet</small>'}
$('#ab').onclick=async()=>{await api('admin/announce',{ann:$('#an').value,ad:$('#ad2').value},{'x-admin':at});alert('Published. Users see it on next load.')};
</script></body></html>
